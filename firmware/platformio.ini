; PlatformIO — ESP32-C3 Mesh Chat
; Окружения:
;   native — тесты логики mesh_core на ПК (L1/L2), без железа
;   esp32c3 — прошивка платы (сборка; прошивка только по отдельному согласованию)

[platformio]
default_envs = native

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter

; ---------- ПК: тесты без железа ----------
; Окружения разделены: у каждого test-файла свой main(), иначе линковщик
; падает с "multiple definition of main".
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST

[env:native_packet]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
test_filter = test_packet

[env:native_relay]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
test_filter = test_relay

[env:native_nodes]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
test_filter = test_nodes

[env:native_sim]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DUNIT_TEST
test_filter = test_sim

; ---------- Плата ----------
[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    ; Serial → USB-JTAG CDC (HWCDCSerial). Иначе Serial идёт в UART0 (GPIO20/21),
    ; куда ничего не подключено, и логи не видны. ROM пишет в USB.
    ; ARDUINO_USB_MODE=1 → Hardware CDC (USB-JTAG), =0 → Native USB (требует USBCDC.h).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; NimBLE 2.x вместо 1.4.x: 1.4.x написан под ESP-IDF 4.4/5.0 и паникует
; в lld.o (ROM BLE) при инициализации до setup() на Arduino 3.3.12 (ESP-IDF 5.4)
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
